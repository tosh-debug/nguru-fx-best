// ── DERIV API ──
const DERIV_TOKEN="pat_0cd4683a10434ca6081a99fcf0d15bc25761eb07e70090c711837ed54f1d8ee5";
const DERIV_WS_URL="wss://ws.derivws.com/websockets/v3?app_id=1";
const DERIV_SYMS={"XAU/USD":"frxXAUUSD","EUR/USD":"frxEURUSD","GBP/USD":"frxGBPUSD"};
const GRAN={m5:300,m15:900,h4:14400};

function fetchDerivCandles(sym,gran,count){
  count=count||60;
  return new Promise(function(resolve){
    try{
      var ws=new WebSocket(DERIV_WS_URL);
      var t=setTimeout(function(){try{ws.close();}catch(e){}resolve(null);},12000);
      ws.onopen=function(){ws.send(JSON.stringify({authorize:DERIV_TOKEN}));};
      ws.onmessage=function(e){
        var msg=JSON.parse(e.data);
        if(msg.msg_type==="authorize"&&!msg.error){
          ws.send(JSON.stringify({ticks_history:sym,style:"candles",granularity:gran,count:count,end:"latest"}));
        }else if(msg.msg_type==="candles"&&msg.candles){
          clearTimeout(t);try{ws.close();}catch(e){}
          resolve(msg.candles.map(function(c){return{open:+c.open,high:+c.high,low:+c.low,close:+c.close,volume:800+Math.random()*1200,time:c.epoch*1000};}));
        }else if(msg.error){clearTimeout(t);try{ws.close();}catch(e){}resolve(null);}
      };
      ws.onerror=function(){clearTimeout(t);resolve(null);};
    }catch(e){resolve(null);}
  });
}

function fetchDerivPrice(sym){
  return new Promise(function(resolve){
    try{
      var ws=new WebSocket(DERIV_WS_URL);
      var t=setTimeout(function(){try{ws.close();}catch(e){}resolve(null);},8000);
      ws.onopen=function(){ws.send(JSON.stringify({authorize:DERIV_TOKEN}));};
      ws.onmessage=function(e){
        var msg=JSON.parse(e.data);
        if(msg.msg_type==="authorize"&&!msg.error){
          ws.send(JSON.stringify({ticks:sym,subscribe:0}));
        }else if(msg.msg_type==="tick"&&msg.tick){
          clearTimeout(t);try{ws.close();}catch(e){}resolve(+msg.tick.quote);
        }else if(msg.error){clearTimeout(t);try{ws.close();}catch(e){}resolve(null);}
      };
      ws.onerror=function(){clearTimeout(t);resolve(null);};
    }catch(e){resolve(null);}
  });
}

// ── DEMO DATA (accurate June 2026 prices) ──
var CFGS={"XAU/USD":{base:4540,vol:12,trend:0.3,dec:2},"EUR/USD":{base:1.1653,vol:0.0009,trend:-0.05,dec:5},"GBP/USD":{base:1.3462,vol:0.0012,trend:0.05,dec:5}};
function genCandles(base,n,vol,trend){
  var p=base,res=[];
  for(var i=0;i<n;i++){
    var push=(Math.random()-0.47+trend*0.08)*vol,o=p,c=p+push;
    var h=Math.max(o,c)+Math.random()*vol*0.4,l=Math.min(o,c)-Math.random()*vol*0.4;
    res.push({open:o,high:h,low:l,close:c,volume:600+Math.random()*1800,time:Date.now()-((n-i)*5*60*1000)});
    p=c;
  }
  return res;
}
function demoData(pair){
  var c=CFGS[pair],d=(Math.random()-0.5)*c.vol;
  return{m5:genCandles(c.base,60,c.vol*0.5,c.trend),m15:genCandles(c.base,60,c.vol,c.trend),h4:genCandles(c.base,60,c.vol*2.5,c.trend),price:c.base+d,isDemo:true};
}

async function getPairData(pair){
  var sym=DERIV_SYMS[pair];
  if(!sym)return demoData(pair);
  try{
    var results=await Promise.all([
      fetchDerivCandles(sym,GRAN.m15,60),
      fetchDerivCandles(sym,GRAN.h4,60),
      fetchDerivPrice(sym)
    ]);
    var m15raw=results[0],h4raw=results[1],livePrice=results[2];
    if(!m15raw||m15raw.length<5)return demoData(pair);
    var price=livePrice||m15raw[m15raw.length-1].close;
    return{m5:m15raw.slice(-30),m15:m15raw,h4:h4raw||genCandles(price,60,CFGS[pair].vol*2,0),price:price,isDemo:false};
  }catch(e){return demoData(pair);}
}

// ── LICENSE ──
function validateLicense(key){
  if(!key)return{valid:false,reason:"No key entered"};
  var clean=key.trim().toUpperCase();
  var match=clean.match(/^NGFX-(\d{8})-([A-F0-9]{8})$/);
  if(!match)return{valid:false,reason:"Invalid format. Expected: NGFX-YYYYMMDD-XXXXXXXX"};
  var s=match[1];
  var exp=new Date(parseInt(s.slice(0,4)),parseInt(s.slice(4,6))-1,parseInt(s.slice(6,8)));
  if(isNaN(exp.getTime()))return{valid:false,reason:"Invalid date in key"};
  if(new Date()>exp){var d=Math.floor((new Date()-exp)/86400000);return{valid:false,reason:"Key expired "+d+" day"+(d!==1?"s":"")+" ago. Contact Nguruh to renew."};}
  return{valid:true,daysLeft:Math.ceil((exp-new Date())/86400000),expDate:exp.toDateString()};
}

// ── MATHS ──
function ema(p,n){if(p.length<n)return null;var k=2/(n+1),e=0;for(var i=0;i<n;i++)e+=p[i];e/=n;for(var i=n;i<p.length;i++)e=p[i]*k+e*(1-k);return e;}
function avg(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:0;}
function calcRSI(cls,period){
  period=period||14;if(cls.length<period+1)return 50;
  var g=0,l=0;
  for(var i=cls.length-period;i<cls.length;i++){var d=cls[i]-cls[i-1];if(d>0)g+=d;else l-=d;}
  return Math.round(100-(100/(1+(g/(l||0.001)))));
}
function calcCVD(cs){var r=0;return cs.map(function(c){r+=(c.close-c.open)/((c.high-c.low)||1)*c.volume;return r;});}
function vspike(cs,idx,thr){thr=thr||1.5;var lb=cs.slice(Math.max(0,idx-20),idx);return lb.length>=5&&cs[idx].volume>avg(lb.map(function(c){return c.volume;}))*thr;}
function findSwings(cs,lb){lb=lb||3;var sH=[],sL=[];for(var i=lb;i<cs.length-lb;i++){var c=cs[i],lH=cs.slice(i-lb,i).map(function(x){return x.high;}),rH=cs.slice(i+1,i+lb+1).map(function(x){return x.high;}),lL=cs.slice(i-lb,i).map(function(x){return x.low;}),rL=cs.slice(i+1,i+lb+1).map(function(x){return x.low;});if(c.high>Math.max.apply(null,lH.concat(rH)))sH.push({i:i,price:c.high});if(c.low<Math.min.apply(null,lL.concat(rL)))sL.push({i:i,price:c.low});}return{sH:sH,sL:sL};}
function getBias(h4){if(h4.length<20)return"neutral";var cl=h4.map(function(c){return c.close;}),e20=ema(cl,Math.min(20,cl.length)),e50=ema(cl,Math.min(50,cl.length)),cur=cl[cl.length-1];if(!e20||!e50)return"neutral";if(cur>e20&&e20>e50)return"bullish";if(cur<e20&&e20<e50)return"bearish";return"neutral";}

// ── CONFLUENCE WEIGHTS ──
var CW={h4BiasAligned:{label:"H4 bias",weight:18},keyLevelConfluence:{label:"Key level",weight:20},orderBlock:{label:"Order block",weight:16},fairValueGap:{label:"FVG",weight:12},volumeSpike:{label:"Vol spike",weight:18},cvdDivergence:{label:"CVD div",weight:15},rejectionCandle:{label:"Rejection",weight:16},liquiditySweep:{label:"Liq sweep",weight:20},londonSession:{label:"London",weight:12},nyOverlap:{label:"NY overlap",weight:14},cleanSL:{label:"Clean SL",weight:10},intradayMomentum:{label:"Momentum",weight:14},m5Confirmation:{label:"M5 confirm",weight:12},rsiConfluence:{label:"RSI extreme",weight:10}};
function calcProb(keys){return Math.min(88,Math.round(28+keys.reduce(function(s,k){return s+(CW[k]?CW[k].weight:0);},0)/1.6));}

// ── RISK ──
function calcRisk(capital,riskPct,entry,sl,direction,pair,probMul){
  var rAmt=(capital*riskPct)/100*probMul,slPips=Math.abs(entry-sl);if(!slPips)return null;
  var pipVal=10,slInPips=pair==="XAU/USD"?slPips/0.1:slPips/0.0001;
  var lots=Math.max(0.01,Math.floor((rAmt/(slInPips*pipVal))*100)/100);
  var dist=Math.abs(entry-sl),sign=direction==="BUY"?1:-1,dec=CFGS[pair].dec;
  var tp1=+(entry+sign*dist*2.5).toFixed(dec),tp2=+(entry+sign*dist*3.5).toFixed(dec),tp3=+(entry+sign*dist*5).toFixed(dec);
  return{riskAmount:rAmt.toFixed(2),lots:lots.toFixed(2),slInPips:slInPips.toFixed(1),tp1:tp1,tp2:tp2,tp3:tp3,
    potProfit1:(slInPips*2.5*pipVal*lots).toFixed(2),potProfit2:(slInPips*3.5*pipVal*lots).toFixed(2),potProfit3:(slInPips*5*pipVal*lots).toFixed(2),
    lotsTP1:Math.max(0.01,Math.floor(lots*50)/100).toFixed(2)};
}

// ── STRATEGY ──
function getSess(){var h=new Date().getUTCHours();if(h>=7&&h<12)return"london";if(h>=12&&h<17)return"overlap";if(h>=17&&h<20)return"ny";return"off";}
function runStrategy(pair,data){
  var m5=data.m5,m15=data.m15,h4=data.h4,price=data.price;
  var bias=getBias(h4),sess=getSess();
  var inL=sess==="london",inO=sess==="overlap",inNY=sess==="ny";
  var sLbl=inL?"London open":inO?"London/NY":inNY?"New York":"Off-session";
  var li=m15.length-1;if(li<2)return{signals:[],partialScore:10,ck:[],bias:bias};
  var last=m15[li],prev=m15[li-1];
  var closes=m15.map(function(c){return c.close;}),rsiVal=calcRSI(closes);
  var cvdArr=calcCVD(m15),l5=cvdArr.slice(-5),cvdUp=l5[l5.length-1]>l5[0],cvdDn=l5[l5.length-1]<l5[0];
  var rng=last.high-last.low;
  var engBull=last.close>prev.high&&last.close>last.open,engBear=last.close<prev.low&&last.close<last.open;
  var pinBull=(Math.min(last.open,last.close)-last.low)>rng*0.55,pinBear=(last.high-Math.max(last.open,last.close))>rng*0.55;
  var vs=vspike(m15,li,1.5);
  var m5last=m5[m5.length-1],m5prev=m5[m5.length-2];
  var m5Bull=m5last&&m5prev&&m5last.close>m5prev.high&&m5last.close>m5last.open;
  var m5Bear=m5last&&m5prev&&m5last.close<m5prev.low&&m5last.close<m5last.open;
  var sc=0,rs=[],ck=[];
  if(bias!=="neutral"){sc+=18;ck.push("h4BiasAligned");}
  if(inL){sc+=12;ck.push("londonSession");}else if(inO||inNY){sc+=14;ck.push("nyOverlap");}
  if((bias==="bullish"&&m5Bull)||(bias==="bearish"&&m5Bear)){sc+=14;ck.push("intradayMomentum");}

  if(pair==="XAU/USD"){
    var vm={};m15.forEach(function(c){var k=Math.round(c.close/50)*50;vm[k]=(vm[k]||0)+c.volume;});
    var poc=+Object.keys(vm).sort(function(a,b){return vm[b]-vm[a];})[0];
    var pdh=Math.max.apply(null,m15.slice(-40).map(function(c){return c.high;}));
    var pdl=Math.min.apply(null,m15.slice(-40).map(function(c){return c.low;}));
    var nr=Math.round(price/50)*50;
    var nL=Math.abs(price-pdl)<3||Math.abs(price-poc)<3,nH=Math.abs(price-pdh)<3||Math.abs(price-poc)<3,nR=Math.abs(price-nr)<3;

      if(cvdUp){sc+=15;rs.push("CVD rising — buyers absorbing");ck.push("cvdDivergence");}
      if(pinBull||engBull){sc+=20;rs.push("Bullish rejection M15");ck.push("rejectionCandle");}
      if(m5Bull){sc+=12;rs.push("M5 bullish confirm");ck.push("m5Confirmation");}
      if(rsiVal<35){sc+=10;rs.push("RSI oversold ("+rsiVal+")");ck.push("rsiConfluence");}

    }
    if(bias==="bearish"){
      if(nH){sc+=30;rs.push("Price at key resistance — PDH/POC");ck.push("keyLevelConfluence");}
      if(nR){sc+=15;rs.push("Round number $"+nr);}
      if(vs){sc+=20;rs.push("Volume spike 150%+");ck.push("volumeSpike");}
      if(cvdDn){sc+=15;rs.push("CVD falling — sellers dominant");ck.push("cvdDivergence");}
      if(pinBear||engBear){sc+=20;rs.push("Bearish rejection M15");ck.push("rejectionCandle");}
      if(m5Bear){sc+=12;rs.push("M5 confirms");ck.push("m5Confirmation");}
      if(rsiVal>65){sc+=10;rs.push("RSI overbought ("+rsiVal+")");ck.push("rsiConfluence");}
      ck.push("cleanSL");
      if(sc>=55){var sl=+(last.high+1.5).toFixed(2);return{signals:[{pair:pair,direction:"SELL",entry:+price.toFixed(2),sl:sl,score:sc,reasons:rs,ck:ck,bias:bias,session:sLbl,tf:"M15·M5",rsi:rsiVal}],partialScore:sc,ck:ck,bias:bias};}

    }

function renderChart(container,candles,price,pair,bias,formPct,ck,latestSig,isDemo){

  var highs=shown.map(function(c){return c.high;}),lows=shown.map(function(c){return c.low;});

  closes.forEach(function(cl,i){var e=ema(closes.slice(0,i+1),Math.min(50,i+1));if(e)ema50pts.push((6+i*cW+cW/2)+","+(toY(e)));});
  var maxVol=Math.max.apply(null,shown.map(function(c){return c.volume;}).concat([1]));
  var threshPct=48;
  var fCol=formPct>=threshPct?C.green:formPct>=threshPct*0.65?C.amber:C.blue;
  var fLbl=formPct>=threshPct?"🔥 Signal ready":formPct>=threshPct*0.65?"⚡ Setup forming":formPct>=20?"👁 Watching":"Scanning";
  var pairC=pair==="XAU/USD"?C.gold:pair==="EUR/USD"?C.blue:C.purple;

window.dismissSig=function(id){S.signals=S.signals.filter(function(s){return s.id!==id;});refreshContent();};
window.markResult=function(id,result){
  var sig=S.signals.filter(function(s){return s.id===id;})[0];
  if(sig){var d=result==="win"?parseFloat(sig.calc?sig.calc.potProfit2:0):-parseFloat(sig.calc?sig.calc.riskAmount:0);S.dailyPnl=+(S.dailyPnl+d).toFixed(2);}
  S.signals=S.signals.map(function(s){return s.id===id?Object.assign({},s,{result:result}):s;});
  S.history=S.history.map(function(s){return s.id===id?Object.assign({},s,{result:result}):s;});
  refreshContent();updateStatus();
};

function renderCharts(){
  PAIRS.forEach(function(pair){
    var el=document.getElementById("chart-"+pair.replace("/","-"));if(!el)return;
    var cd=S.chartData[pair],fm=S.formation[pair]||{};
    var latestSig=null;for(var i=0;i<S.signals.length;i++){if(S.signals[i].pair===pair&&!S.signals[i].result){latestSig=S.signals[i];break;}}
    var formPct=Math.min(100,Math.round(((fm.partialScore||0)/115)*100));
    if(cd&&cd.m15)renderChart(el,cd.m15,cd.price,pair,fm.bias||"neutral",formPct,fm.ck||[],latestSig,cd.isDemo||false);
  });
}

function updateStatus(){
  var el=document.getElementById("hdr-status");

// ── SCANNER ──
async function doScan(){
  if(new Date().getUTCHours()>=19)return;
  S.scanCount++;
  for(var pi=0;pi<PAIRS.length;pi++){
    var pair=PAIRS[pi];
    try{
      var data=await getPairData(pair);
      S.chartData[pair]=data;
      var result=runStrategy(pair,data);
      S.formation[pair]={partialScore:result.partialScore,ck:result.ck,bias:result.bias};
      if(result.signals.length>0){
        var now=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
        result.signals.forEach(function(sig){
          var prob=calcProb(sig.ck||[]);
          var pMul=prob>=75?1:prob>=60?0.75:0.5;
          var calc=calcRisk(S.capital,S.riskPct,sig.entry,sig.sl,sig.direction,sig.pair,pMul);
          var s=Object.assign({},sig,{id:Date.now()+Math.random(),time:now,createdAt:Date.now(),result:null,prob:prob,calc:calc});
          S.signals.unshift(s);S.history.unshift(Object.assign({},s));
          playSound(sig.direction);
        });
      }
      if(S.tab==="charts"){
        var chartEl=document.getElementById("chart-"+pair.replace("/","-"));
        if(chartEl){
          var fm=S.formation[pair]||{},latestSig=null;
          for(var i=0;i<S.signals.length;i++){if(S.signals[i].pair===pair&&!S.signals[i].result){latestSig=S.signals[i];break;}}
          var formPct=Math.min(100,Math.round(((fm.partialScore||0)/115)*100));
          renderChart(chartEl,data.m15,data.price,pair,fm.bias||"neutral",formPct,fm.ck||[],latestSig,data.isDemo||false);
        }
      }
    }catch(e){console.warn("Scan error",pair,e);}
  }
  if(S.tab==="signals")refreshContent();
  updateStatus();
}

function startCountdown(ms){
  if(cdInt)clearInterval(cdInt);
  S.secsLeft=Math.floor(ms/1000);
  cdInt=setInterval(function(){
    S.secsLeft=Math.max(0,S.secsLeft-1);
    var bar=document.getElementById("scan-bar");
    if(bar)bar.style.width=((1-S.secsLeft/(ms/1000))*100)+"%";
    updateStatus();
  },1000);
}

function startScanner(){
  var ms=120000;
  doScan();startCountdown(ms);
  if(scanInt)clearInterval(scanInt);
  scanInt=setInterval(function(){doScan();startCountdown(ms);},ms);
}
